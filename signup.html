<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Flowtask</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <div class="box">
 <button><a href="PROJECT-JS.html">Back to home</a></button>

        <img src="./image/image copy 4.png" alt="logo" class="logo">
        <h2>Create your account</h2>
        <p>Fill in your details to get started.</p>

        <form>
            <input type="text" placeholder="Full name" required>
            <input type="number" placeholder="Age" min="1" max="120" required>
            <input type="number" placeholder="Year of birth" min="1900" max="2026" required>
            <input type="text" placeholder="State" required>
            <input type="tel" placeholder="Phone number" required>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button onclick="location.href='dashboard.html'" type="submit">Sign up</button>
        </form>

        <p class="small">Already have an account? <button><a href="login.html">Log in</a></button></p>
    </div>

    <script src="signup.js"></script>
</body>
</html>
