<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Flowtask</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <header>
        <div class="brand">
            <img src="./image/image copy 4.png" alt="logo" class="logo">
            <h1>Flowtask</h1>
        </div>

        <div class="actions">
            <button onclick="location.href='Add.html'">+ Add Task</button>
            <button class="outline">Manage Task</button>
            <button class="logout" onclick="location.href='login.html'">Logout</button>
        </div>
    </header>

    <main class="board">
        <div class="column">
            <h2>To-Do</h2>
        </div>

        <div class="column">
            <h2>In Progress</h2>
        </div>

        <div class="column">
            <h2>Done</h2>
        </div>
    </main>

</body>
</html>
